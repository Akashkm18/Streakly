version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: streakly-postgres
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: streakly
    ports:
      - "5432:5432"
    volumes:
      - streakly_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    container_name: streakly-mailpit
    restart: always
    ports:
      - "1025:1025" # SMTP port
      - "8025:8025" # Web UI
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "1025"]
      interval: 5s
      timeout: 3s
      retries: 5

  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: streakly-server
    restart: always
    environment:
      PORT: 5000
      NODE_ENV: production
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/streakly?schema=public
      CLIENT_URL: http://localhost:5173
      JWT_ACCESS_SECRET: streakly_production_jwt_access_secret_super_secure_32chars!
      JWT_REFRESH_SECRET: streakly_production_jwt_refresh_secret_super_secure_32chars!
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_FROM: "Streakly <support@streakly.dev>"
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      mailpit:
        condition: service_healthy

  client:
    build:
      context: ./client
      dockerfile: Dockerfile
    container_name: streakly-client
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - server

volumes:
  streakly_pgdata:
